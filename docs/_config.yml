title: Engram - Context Engineering Platform
description: Enterprise AI Memory & Cognition Platform
baseurl: ""
url: "https://wiki.engram.work"

remote_theme: just-the-docs/just-the-docs

# Search
search_enabled: true
search:
  tokenizer_separator: /[\s/]+/

# Appearance
color_scheme: dark

# Aux links
aux_links:
  "GitHub Repository": "https://github.com/zimaxnet/engram"

# Navigation
back_to_top: true
back_to_top_text: "Back to top"

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  
include: [".gitignore"]

# Plugins
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-remote-theme
